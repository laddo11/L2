<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Forgive Me, Laddu! ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle, #ff6b81 0%, #c44569 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Reels Style Floating Hearts & Glow Effect */
        .reel-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: reelFloat 4s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes reelFloat {
            0% {
                transform: translateY(0) translateX(0) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(50px) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glassmorphism Reel Card */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 380px;
            width: 90%;
            animation: cardEntrance 1s ease-out;
        }

        @keyframes cardEntrance {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pulse-emoji {
            font-size: 70px;
            display: inline-block;
            animation: pulseAnim 1.2s infinite alternate;
            margin-bottom: 15px;
        }

        @keyframes pulseAnim {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 20px rgba(255,255,255,0.9)); }
        }

        h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: #ffeaa7;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background-color: #00b894;
            color: white;
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
        }

        .btn-yes:hover {
            background-color: #55efc4;
            transform: scale(1.08);
        }

        .btn-no {
            background-color: #ff7675;
            color: white;
            position: relative;
            box-shadow: 0 5px 15px rgba(255, 118, 117, 0.4);
        }

        .hidden {
            display: none;
        }

        #successMessage h2 {
            color: #55efc4;
            font-size: 22px;
            margin-bottom: 8px;
        }

        #successMessage p {
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Live Reel Background Animation Container -->
    <div class="reel-container" id="reelContainer"></div>

    <div class="card">
        <div class="pulse-emoji" id="mainEmoji">🥺</div>
        <h1>I'm So Sorry, Laddu!</h1>
        <p class="subtitle">রাগ করে থেকো না সোনা, প্লিজ মাফ করে দাও! ❤️</p>
        
        <div class="buttons" id="btnGroup">
            <button class="btn-yes" onclick="forgiven()">মাফ করে দিলাম! 🥰</button>
            <button id="noBtn" class="btn-no" onmouseover="moveButton()" ontouchstart="moveButton()">না 😤</button>
        </div>

        <div id="successMessage" class="hidden">
            <h2>Yay! Thank You! 🎉💖</h2>
            <p>তুমি পৃথিবীর সবচেয়ে মিষ্টি মানুষ! আর কখনো রাগ করব না Promise! 😊</p>
        </div>
    </div>

    <script>
        // High-frequency live reel heart generator
        function createReelHeart() {
            const container = document.getElementById('reelContainer');
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            const emojis = ['❤️', '💖', '✨', '🥺', '💕', '💫', '🌸'];
            heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

            // Random horizontal positioning and speed like a viral reel
            heart.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 2 + 2.5; // 2.5s to 4.5s
            heart.style.animationDuration = duration + 's';
            
            const size = Math.random() * 15 + 18;
            heart.style.fontSize = size + 'px';

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Spawn hearts continuously like live stream / reel
        setInterval(createReelHeart, 200);

        // Playful runaway "No" button
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = (Math.random() - 0.5) * 200;
            const y = (Math.random() - 0.5) * 150;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Success trigger
        function forgiven() {
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('mainEmoji').innerText = '🥰💖';
            document.getElementById('successMessage').classList.remove('hidden');
            
            // Burst extra hearts
            for(let i = 0; i < 40; i++) {
                setTimeout(createReelHeart, i * 40);
            }
        }
    </script>
</body>
</html>
