<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm So Sorry, Laddu! ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            bottom: -20px;
            display: inline-block;
            transform: rotate(-45deg);
            animation: floatUp 6s linear infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: inherit;
            height: inherit;
            background-color: inherit;
            border-radius: 50%;
        }

        .heart::before {
            top: -50%;
            left: 0;
        }

        .heart::after {
            left: 50%;
            top: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(-45deg) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(-45deg) scale(1.2);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 420px;
            width: 90%;
        }

        .animation-icon {
            font-size: 60px;
            animation: bounce 1.5s infinite ease-in-out;
            margin-bottom: 10px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #d63031;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #636e72;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }

        button {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-yes {
            background-color: #00b894;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
        }

        .btn-yes:hover {
            background-color: #019875;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #ff7675;
            color: white;
            position: relative;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.4);
        }

        .hidden {
            display: none;
        }

        #successMessage h2 {
            color: #00b894;
            margin-bottom: 8px;
        }

        #successMessage p {
            color: #2d3436;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="hearts-container" id="heartsContainer"></div>

    <div class="card">
        <div class="animation-icon">🥺</div>
        <h1>I am Really, Really Sorry!</h1>
        <p class="subtitle">আমার ভুল হয়ে গেছে, প্লিজ রাগ করো না সোনা! ❤️</p>
        
        <div class="buttons">
            <button id="forgiveBtn" class="btn-yes" onclick="forgiven()">মাফ করে দিলাম! 🥰</button>
            <button id="noBtn" class="btn-no" onmouseover="moveButton()" ontouchstart="moveButton()">না, রাগ কমবে না 😤</button>
        </div>

        <div id="successMessage" class="hidden">
            <h2>Yay! Thank you so much! 🎉💖</h2>
            <p>তুমি পৃথিবীর সবচেয়ে ভালো মানুষ! আর কখনো রাগ করব না Promise! 😊</p>
        </div>
    </div>

    <script>
        function createHeart() {
            const heartsContainer = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.classList.add('heart');

            const size = Math.random() * 15 + 10;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            heart.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 3 + 3;
            heart.style.animationDuration = `${duration}s`;

            const colors = ['#ff6b6b', '#ff8787', '#ff9999', '#ffa8a8', '#ffb3b3'];
            heart.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 300);

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function forgiven() {
            document.querySelector('.buttons').style.display = 'none';
            document.querySelector('.animation-icon').innerText = '🥰💖';
            document.getElementById('successMessage').classList.remove('hidden');
            
            for(let i = 0; i < 30; i++) {
                setTimeout(createHeart, i * 50);
            }
        }
    </script>
</body>
</html>
